name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Base Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.base.svg
          base: header, activity, community, repositories
          plugin_lines: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      - name: Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Yuurisan-N1
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  language-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Generate language SVG
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python generate_langs.py

      - name: Generate tech stack SVG
        run: python generate_techstack.py

      - name: Generate streak SVG
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python generate_streak.py

      - name: Generate connect SVG
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python generate_connect.py

      - name: Commit SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics.langs.svg metrics.techstack.svg metrics.streak.svg metrics.connect.svg views_cache.json
          git diff --cached --quiet || git commit -m "feat: update all metric svgs"
          git push