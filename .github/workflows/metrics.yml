name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Discover owned repositories
        id: repositories
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          repositories="$(
            gh api --paginate \
              'user/repos?per_page=100&affiliation=owner&visibility=all' \
              --jq '.[].full_name' \
              | paste -sd ',' -
          )"

          if [ -z "$repositories" ]; then
            echo "No owned repositories were found."
            exit 1
          fi

          echo "Repositories discovered:"
          echo "$repositories" | tr ',' '\n'

          {
            echo "list<<EOF"
            echo "$repositories"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Base Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.base.svg
          base: header, activity, community, repositories
          plugin_lines: yes

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.langs.svg
          base: ""

          plugin_languages: yes

          # Analyze repository contents directly instead of relying
          # only on GitHub language statistics.
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: ${{ steps.repositories.outputs.list }}
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15

          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_repositories_workaround: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

      - name: Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push Snake
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
